plugins {
    id 'com.android.application' version '8.7.3'
}
android {
    namespace 'com.samurai.telegram.sample'
    compileSdk 35
    defaultConfig {
        applicationId 'com.samurai.telegram.sample'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation project(':telegram-core-tdlib-android')
}
