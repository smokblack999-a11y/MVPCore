apply plugin: 'java'

ext.artifactId = 'mvp-core'

// Publishing is intentionally not applied during the library build.
// The former Bintray/Android-Maven plugins are discontinued and broke CI.

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    //noinspection GradleDependency
    compileOnly 'com.google.android:android:1.6_r2'
    compileOnly project(':stub-android')
    compileOnly project(':stub-viewstate-binder')
}

//noinspection GroovyUnusedAssignment
sourceCompatibility = JavaVersion.VERSION_1_8
//noinspection GroovyUnusedAssignment
targetCompatibility = JavaVersion.VERSION_1_8

