apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion "28.0.3"

    defaultConfig {
        applicationId "serg.chuprin.sample"
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

gradle.projectsEvaluated {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xmaxerrs" << "500"
        // Keep both processors explicitly in the legacy AGP 3.5 toolchain.
        // This prevents processor discovery/order differences from hiding
        // Dagger's generated component sources behind the custom processor.
        options.compilerArgs << "-processor" << "serg.chuprin.mvp_core.processor.MvpProcessor,dagger.internal.codegen.ComponentProcessor"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "com.android.support:design:$supportVersion"
    implementation "com.android.support:appcompat-v7:$supportVersion"

    implementation project(':mvp-core')
    implementation project(':mvp-core-android')
    annotationProcessor project(':mvp-core-processor')

    // Dagger: keep runtime and compiler versions identical.
    implementation 'com.google.dagger:dagger:2.28.3'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.28.3'

    //rx
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    //ui
    implementation 'com.afollestad.material-dialogs:core:0.9.6.0'
    implementation 'com.afollestad.material-dialogs:commons:0.9.6.0'
}
