name: Telegram Core — reproducible TDLib Android build

on:
  push:
    branches:
      - telegram-core
  pull_request:
    branches:
      - telegram-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: telegram-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        run: |
          sdkmanager "platforms;android-34" "platforms;android-35" "cmake;3.22.1" "ndk;23.2.8568313"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf

      - name: Verify pin
        run: |
          test "$(grep '^TDLIB_COMMIT=' TDLIB_VERSION | cut -d= -f2)" = "022d60202e446ad1287b9fb68e687c8a0760788b"
          test "$(grep '^TDLIB_RELEASE=' TDLIB_VERSION | cut -d= -f2)" = "1.8.66"

      - name: Build real TDLib JSONJava native layer
        run: ./scripts/build-tdlib-android.sh

      - name: Verify generated TDLib artifacts
        run: |
          test -s telegram-core-tdlib-android/generated-src/main/java/org/drinkless/tdlib/JsonClient.java
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "telegram-core-tdlib-android/generated-jni-libs/$abi/libtdjsonjava.so"
          done
          grep -R "class JsonClient" telegram-core-tdlib-android/generated-src/main/java/org/drinkless/tdlib/JsonClient.java

      - name: Unit tests and Android build
        run: |
          gradle test
          gradle :telegram-core-tdlib-android:assembleDebug :telegram-core-sample-android:assembleDebug

      - name: Upload reproducible TDLib build
        uses: actions/upload-artifact@v4
        with:
          name: telegram-core-tdlib-android-${{ github.sha }}
          path: |
            telegram-core/telegram-core-tdlib-android/generated-jni-libs/**
            telegram-core/telegram-core-tdlib-android/generated-src/main/java/org/drinkless/tdlib/JsonClient.java
            telegram-core/telegram-core-tdlib-android/build/outputs/**
            telegram-core/telegram-core-sample-android/build/outputs/**
          if-no-files-found: error
