name: Telegram Core

on:
  push:
    branches: [telegram-core]
  pull_request:
    branches: [telegram-core]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Telegram Core API and TDLib adapter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile and test
        run: gradle -p telegram-core clean build --no-daemon --stacktrace
