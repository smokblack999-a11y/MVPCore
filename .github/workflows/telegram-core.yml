name: Telegram Core

on:
  push:
    branches: [telegram-core]
  pull_request:
    branches: [telegram-core]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Reproducible Telegram Core + pinned TDLib
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          source telegram-core/TDLIB_VERSION
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"
          sdkmanager --list_installed | grep -E "platforms;android-34|cmake;${CMAKE_VERSION}|ndk;${ANDROID_NDK_VERSION}" || true

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf ninja-build php-cli wget

      - name: Build pinned TDLib JSONJava for all Android ABIs
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: bash telegram-core/scripts/build-tdlib-android.sh

      - name: Verify generated TDLib native artifacts
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "telegram-core/telegram-core-tdlib-android/generated-jni-libs/${abi}/libtdjsonjava.so"
          done
          test -s telegram-core/telegram-core-tdlib-android/generated-src/main/java/org/drinkless/tdlib/JsonClient.java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile and test
        run: gradle -p telegram-core clean build --no-daemon --stacktrace

      - name: Upload reproducible TDLib artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-core-tdlib-${{ github.sha }}
          path: |
            telegram-core/telegram-core-tdlib-android/generated-jni-libs/**/libtdjsonjava.so
            telegram-core/telegram-core-tdlib-android/generated-src/main/java/org/drinkless/tdlib/JsonClient.java
            telegram-core/telegram-core-tdlib-android/generated-*-version.txt
            telegram-core/telegram-core-tdlib-android/generated-tdlib-commit.txt
