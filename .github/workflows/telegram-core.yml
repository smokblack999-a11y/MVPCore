name: Telegram Core

on:
  push:
    branches:
      - telegram-core
  pull_request:
    branches:
      - telegram-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile standalone Telegram Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile Telegram Core
        run: ./gradlew :telegram-core:build --no-daemon --stacktrace
