name: MVPCore CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          architecture: x64

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show environment
        run: |
          java -version
          ./gradlew --version

      - name: Build and test
        run: ./gradlew clean build --stacktrace --warning-mode all

      - name: Assemble sample debug APK
        run: ./gradlew :sample:assembleDebug --stacktrace

      - name: Verify sample debug APK
        run: test -s sample/build/outputs/apk/debug/sample-debug.apk

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvpcore-build
          path: |
            **/build/libs/**
            **/build/outputs/**
          if-no-files-found: ignore
