name: Telegram Core TDLib

on:
  push:
    branches: [telegram-core]
    paths:
      - 'telegram-core/**'
      - '.github/workflows/telegram-core-tdlib.yml'
  pull_request:
    branches: [telegram-core]
    paths:
      - 'telegram-core/**'
      - '.github/workflows/telegram-core-tdlib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tdlib-android:
    name: Build and runtime-test pinned TDLib JSONJava
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Install pinned Android toolchain and native build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;35.0.0" "cmake;3.22.1" "ndk;23.2.8568313"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gperf
          gperf --version

      - name: Build pinned TDLib JSONJava
        working-directory: telegram-core
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -euo pipefail
          chmod +x scripts/build-tdlib-android.sh
          ./scripts/build-tdlib-android.sh

      - name: Verify real tdjsonjava artifacts
        working-directory: telegram-core/telegram-core-tdlib-android
        run: |
          set -euo pipefail
          test "$(cat generated-tdlib-commit.txt)" = "022d60202e446ad1287b9fb68e687c8a0760788b"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "generated-jni-libs/$abi/libtdjsonjava.so"
            file "generated-jni-libs/$abi/libtdjsonjava.so"
          done
          test -s generated-src/main/java/org/drinkless/tdlib/JsonClient.java

      - name: Build Telegram Core Android library
        working-directory: telegram-core
        run: gradle :telegram-core-tdlib-android:assembleDebug --stacktrace

      - name: Run real JNI smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: gradle -p telegram-core :telegram-core-tdlib-android:connectedDebugAndroidTest --stacktrace

      - name: Upload TDLib Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-core-tdlib-android
          path: |
            telegram-core/telegram-core-tdlib-android/build/outputs/aar/*.aar
            telegram-core/telegram-core-tdlib-android/generated-tdlib-commit.txt
            telegram-core/telegram-core-tdlib-android/generated-openssl-version.txt
            telegram-core/telegram-core-tdlib-android/generated-cmake-version.txt
            telegram-core/telegram-core-tdlib-android/generated-ndk-version.txt
            telegram-core/telegram-core-tdlib-android/generated-android-platform.txt
          if-no-files-found: error
