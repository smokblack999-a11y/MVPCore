# Project-wide Gradle settings.
# CI and local builds should not expose a remote debugger by default.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.daemon=false

# Keep legacy Android annotation processing isolated from the Java/Kotlin
# compilation path. This project uses a custom non-incremental processor.
android.enableSeparateAnnotationProcessing=true
