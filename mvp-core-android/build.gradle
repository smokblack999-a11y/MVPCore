apply plugin: 'java'

ext.artifactId = 'mvp-core-android'

// Publishing integrations removed: Bintray and the legacy install plugin are obsolete.
// Local Maven publication is not required for CI compilation.

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation project(':mvp-core')

    compileOnly project(':stub-android')
    compileOnly 'com.google.android:android:4.1.1.4'
}

//noinspection GroovyUnusedAssignment
sourceCompatibility = JavaVersion.VERSION_1_8
//noinspection GroovyUnusedAssignment
targetCompatibility = JavaVersion.VERSION_1_8
